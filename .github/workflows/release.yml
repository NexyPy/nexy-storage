name: Release

# Tag-driven PyPI publishing. Configure a trusted publisher on PyPI for
# NexyPy/nexy-storage, workflow release.yml, environment pypi. No API token is stored here.
# The module is in design phase: the workflow stays dormant until a package exists.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

env:
  UV_VERSION: "0.13.9"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can point at any commit. Publish only commits already on main.
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Verify tag matches package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          EXPECTED="$(uv version --short)"
          ACTUAL="$(uv run --isolated --no-project --with dist/*.whl python -c 'import nexy_storage; print(nexy_storage.__version__)')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Smoke test source distribution
        run: |
          EXPECTED="$(uv version --short)"
          ACTUAL="$(uv run --isolated --no-project --with dist/*.tar.gz python -c 'import nexy_storage; print(nexy_storage.__version__)')"
          test "$EXPECTED" = "$ACTUAL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nexy-storage/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
